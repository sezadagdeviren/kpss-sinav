<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPSS Study Hub | Premium Öğrenme Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                <span>KPSS study.dev</span>
            </div>
            <nav id="category-nav">
                <a href="#" class="nav-item active" data-category="Türkçe">
                    <span>📚 Türkçe</span>
                    <span class="count-badge" id="count-tr">-</span>
                </a>
                <a href="#" class="nav-item" data-category="Tarih" id="nav-tarih">
                    <span>🏛️ Tarih</span>
                    <span class="count-badge" id="count-hist">-</span>
                </a>
                <a href="#" class="nav-item" data-category="Cografya" id="nav-cografya">
                    <span>🌍 Coğrafya</span>
                    <span class="count-badge" id="count-geo">-</span>
                </a>
                <a href="#" class="nav-item" data-category="Matematik" id="nav-matematik">
                    <span>🧮 Matematik</span>
                    <span class="count-badge" id="count-mat">-</span>
                </a>
                <a href="#" class="nav-item" data-category="Anayasa" id="nav-anayasa">
                    <span>⚖️ Vatandaşlık</span>
                    <span class="count-badge" id="count-vat">-</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header-section">
                <h1 id="category-title">📚 Türkçe Soruları</h1>
                <p id="category-subtitle">Konu başlıklarına göre ayrılmış sorular ve çözümleri.</p>
            </header>

            <!-- Topic View -->
            <div id="topic-container" class="topic-grid">
                <!-- Topics will be dynamically loaded here -->
                <div class="loading">Dataset yükleniyor...</div>
            </div>

            <!-- Question View (Hidden by default) -->
            <div id="question-view" class="question-container" style="display: none;">
                <button id="btn-back" class="btn-show-answer" style="width: auto; margin-bottom: 2rem; background: var(--glass-bg); color: var(--text-secondary);">← Geri Dön</button>
                <div id="questions-list">
                    <!-- Questions will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
